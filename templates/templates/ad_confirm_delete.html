{% extends 'base.html' %}

{% block title %}Удаление объявления - Avito Clone{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h3>Подтверждение удаления</h3>
            </div>
            <div class="card-body">
                <p class="lead">Вы уверены, что хотите удалить это объявление?</p>
                <h4>"{{ ad.title }}"</h4>
                <p class="text-muted">Это действие нельзя отменить.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg">Да, удалить</button>
                        <a href="{% url 'ad_detail' ad.pk %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
